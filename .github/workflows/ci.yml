name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Black-box coverage gate
        run: .claude/skills/coverage-gate/gate.sh
      - name: Build
        run: pnpm build

  review:
    # Same-repo PRs only: a fork's PR never runs this job, so it can't spend the subscription.
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Log every tool call, so a blocked one shows up in the job log.
          show_full_output: true
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 30
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(git diff:*),Bash(git log:*),Write(//tmp/**),Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }} using the checks in
            .claude/skills/pr-review/SKILL.md. Skip its coverage gate step and its output and posting
            sections: the test job already ran the gate, and the format below replaces them.

            Sort every finding into one tier:
            - Blocker: wrong output, crash, data loss, security hole, or new src/core behavior with no black-box test.
            - Should: a real problem worth fixing before merge, but not breaking anything.
            - Nit: optional polish. Never a reason to hold the PR.

            Inline comments: for at most 5 Blocker or Should findings that point at one changed line,
            add an inline comment with mcp__github_inline_comment__create_inline_comment. Keep each to
            one or two sentences. No inline comments for Nits.

            Then submit exactly one review with `gh pr review ${{ github.event.pull_request.number }}`
            and --body-file. Write the body to a file under /tmp first (the Write tool is allowed there only).
            Choose the verdict:
            - Approved (--approve): no findings.
            - Approved with nits (--approve): only Nits.
            - Changes requested (--request-changes): at least one Should, no Blockers.
            - Blocked (--request-changes): at least one Blocker, or you couldn't review the change.

            Body format:
            ## Verdict: <Approved | Approved with nits | Changes requested | Blocked>
            <one sentence on why>

            ### Blockers
            1. path/file.ts:LINE: what's wrong. Failure: input → wrong result.
            ### Should
            ### Nits
            ### Checked clean
            <areas with no findings>

            Leave out empty tier sections. Be brief: no praise, no restating the diff.
      # The action exits 0 even when no review got posted, so check that one did for this commit.
      - name: Check a review was posted
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" --paginate \
            --jq "[.[] | select(.commit_id == \"$SHA\" and .user.login == \"claude[bot]\" and .state != \"COMMENTED\")] | length")
          echo "Reviews from claude[bot] on $SHA: $n"
          [ "$n" -gt 0 ] || { echo "::error::The review bot finished without posting a review."; exit 1; }
