<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft A · Season Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Draft A, Season Lab: the same score-bug world as the team page. The field leads; games feed it; races sit beside. */
:root {
  --bug: #0f1a2b; --seg: #1a2840; --seg-2: #24365a; --bug-text: #ffffff; --bug-muted: #a9b7cf;
  --live: #ffc629;
  --ground: #eef1f5; --card: #ffffff; --ink: #0f1a2b; --ink-soft: #3b4860; --ink-muted: #5a6780; --rule: #d5dbe5;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--ink); font: 15px/1.45 Barlow, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
::selection { background: var(--live); color: var(--bug); }
:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
.bc { font-family: "Barlow Semi Condensed", sans-serif; text-transform: uppercase; letter-spacing: .02em; }
.beta { display: inline-block; font-family: "Barlow Semi Condensed", sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 0 4px; border: 1px solid currentColor; border-radius: 2px; line-height: 14px; vertical-align: 2px; }

.app { display: flex; flex-direction: column; min-height: 100dvh; }

/* Top bug: what you've picked, what it changed, and the three actions. */
.top { position: sticky; top: 0; z-index: 6; background: var(--bug); color: var(--bug-text); }
.strip { display: flex; align-items: stretch; height: 60px; }
.brand { display: flex; align-items: center; gap: 8px; padding: 0 18px; font-weight: 700; font-size: 16px; border-right: 1px solid var(--seg-2); color: #fff; text-decoration: none; }
.brand svg { width: 24px; height: 24px; flex: none; }
.title { display: flex; align-items: center; gap: 8px; padding: 0 18px; background: var(--seg); font-size: 22px; font-weight: 800; white-space: nowrap; }
.title .beta { color: var(--bug-muted); }
.sum { display: flex; flex-direction: column; justify-content: center; padding: 0 18px; border-right: 1px solid var(--seg-2); min-width: 150px; }
.sum b { font-size: 19px; font-weight: 800; line-height: 1.1; }
.sum span { font-family: Barlow, sans-serif; text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--bug-muted); }
.head { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0 18px; font-family: Barlow, sans-serif; text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--bug-muted); }
.head.on { color: #fff; font-weight: 600; }
.head.on::before { content: "Last pick"; flex: none; font-family: "Barlow Semi Condensed", sans-serif; text-transform: uppercase; letter-spacing: .06em; font-size: 12px; font-weight: 800; color: var(--bug); background: var(--live); padding: 2px 6px; border-radius: 2px; }
.head span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acts { display: flex; align-items: stretch; }
.acts button { padding: 0 16px; border-left: 1px solid var(--seg-2); font-weight: 700; font-size: 15px; letter-spacing: .04em; }
.acts button:not(:disabled):hover { background: var(--seg); }
.acts .share { background: var(--live); color: var(--bug); border-left: 0; min-width: 116px; }
.acts .share:hover { background: #ffd65c !important; }
.toteam { display: flex; align-items: center; padding: 0 18px; border-left: 1px solid var(--seg-2); font-size: 13px; color: var(--bug-muted); text-decoration: none; font-family: Barlow, sans-serif; text-transform: none; letter-spacing: 0; white-space: nowrap; }

/* Three columns on wide screens, each scrolling on its own. */
.body { flex: 1; display: grid; grid-template-columns: 400px minmax(0, 1fr) 320px; min-height: 0; }
.left { display: contents; }
.pane { padding: 22px 22px 40px; overflow-y: auto; min-height: 0; }
#field { grid-column: 1; grid-row: 1; border-right: 1px solid var(--rule); background: var(--card); }
#games { grid-column: 2; grid-row: 1; }
#races { grid-column: 3; grid-row: 1; border-left: 1px solid var(--rule); background: var(--card); }
h2 { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .02em; margin: 0; line-height: 1.1; }
h3 { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; margin: 22px 0 8px; color: var(--ink-soft); }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.note { margin: 4px 0 14px; font-size: 13px; color: var(--ink-muted); }

/* Segmented control, used for Seeds/Bracket and Big/All. */
.segc { display: inline-flex; background: var(--ground); border-radius: 3px; padding: 3px; flex: none; }
.segc button { height: 30px; padding: 0 12px; border-radius: 2px; font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); }
.segc button i { font-style: normal; font-weight: 600; color: var(--ink-muted); margin-left: 4px; }
.segc button[aria-pressed="true"] { background: var(--bug); color: #fff; }
.segc button[aria-pressed="true"] i { color: var(--bug-muted); }

/* The field: a broadcast standings graphic. */
.board { background: var(--bug); color: #fff; border-radius: 3px; overflow: hidden; }
.grp { display: flex; justify-content: space-between; padding: 7px 38px 5px 12px; font-family: "Barlow Semi Condensed", sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--bug-muted); background: var(--seg); }
.fr { display: grid; grid-template-columns: 34px 5px minmax(0, 1fr) auto 26px; align-items: center; min-height: 44px; border-top: 1px solid var(--seg-2); }
.grp + .fr { border-top: 0; }
.fr .sd { align-self: stretch; display: grid; place-items: center; font-family: "Barlow Semi Condensed", sans-serif; font-weight: 800; font-size: 18px; background: var(--seg); }
.fr .c { align-self: stretch; }
.fr .n { padding: 6px 10px 6px 12px; min-width: 0; }
.fr .n b { display: block; font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 18px; text-transform: uppercase; line-height: 1.1; }
.fr .o { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 800; font-size: 20px; text-align: right; }
.fr .o small { display: none; font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--bug-muted); text-align: right; line-height: 1; }
.fr .mv { text-align: center; font-size: 11px; color: var(--bug-muted); }
.fr .mv.new { color: var(--live); font-family: "Barlow Semi Condensed", sans-serif; font-weight: 800; font-size: 11px; letter-spacing: .04em; }
.fr.flash { animation: flash 900ms ease-out; }
@keyframes flash { from { background: rgba(255,198,41,.28); } to { background: transparent; } }
.bub { border: 1px solid var(--rule); border-radius: 3px; background: var(--card); }
.br { display: grid; grid-template-columns: 5px minmax(0, 1fr) auto 26px; align-items: center; height: 38px; border-top: 1px solid var(--rule); }
.br:first-child { border-top: 0; }
.br .c { align-self: stretch; }
.br b { padding-left: 12px; font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 16px; text-transform: uppercase; }
.br .o { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 800; font-size: 17px; }
.br .mv { text-align: center; font-size: 11px; color: var(--ink-muted); }
.br.out b { color: var(--ink-muted); }
.br.out .mv::after { content: "out"; font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 10px; text-transform: uppercase; }
.more { margin-top: 14px; font-size: 14px; font-weight: 600; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; }
.more:hover { color: var(--ink); }
.rank { list-style: none; margin: 10px 0 0; padding: 0; font-size: 14px; }
.rank li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; padding: 6px 0; border-top: 1px solid var(--rule); }
.rank li span:first-child { color: var(--ink-muted); text-align: right; }
.rank li i { font-style: normal; color: var(--ink-muted); }
.rank li.inf b::after { content: "in field"; margin-left: 8px; font-family: "Barlow Semi Condensed", sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); border: 1px solid var(--rule); border-radius: 2px; padding: 0 4px; vertical-align: 1px; }

/* Bracket: rounds stack; a game is pickable once both sides are known. */
.rd { margin-top: 18px; }
.rd:first-child { margin-top: 0; }
.bg { margin-top: 8px; background: var(--bug); border-radius: 3px; overflow: hidden; }
.bg .gh { padding: 5px 12px; font-size: 12px; font-weight: 600; color: var(--bug-muted); background: var(--seg); }
.side { display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; width: 100%; min-height: 40px; border-top: 1px solid var(--seg-2); text-align: left; color: #fff; }
.side:first-of-type { border-top: 0; }
.side .s { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 800; font-size: 15px; text-align: center; color: var(--bug-muted); }
.side b { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 17px; text-transform: uppercase; padding-right: 12px; }
.side.tbd b { font-family: Barlow, sans-serif; font-weight: 500; font-size: 13px; text-transform: none; color: var(--bug-muted); }
button.side:hover { background: var(--seg); }
.side[aria-pressed="true"] { background: var(--live); color: var(--bug); }
.side[aria-pressed="true"] .s { color: var(--bug); }
.side.lost b { color: var(--bug-muted); text-decoration: line-through; }

/* Games: filters, then each week's games as two-sided bugs. */
.ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.findw { position: relative; flex: 1; min-width: 160px; display: flex; }
.findw svg { position: absolute; left: 11px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--ink-muted); pointer-events: none; }
.find { width: 100%; height: 34px; padding: 0 12px 0 34px; border: 1px solid var(--rule); border-radius: 3px; background: var(--card); }
.find::placeholder { color: var(--ink-muted); }
.fillw { position: relative; }
.fillb { height: 34px; padding: 0 14px; border-radius: 3px; background: var(--bug); color: #fff; font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; }
.fillb:not(:disabled):hover { background: var(--seg-2); }
.menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 4; width: 260px; background: var(--card); border: 1px solid var(--rule); border-radius: 3px; box-shadow: 0 8px 24px rgba(15,26,43,.16); padding: 4px; }
.menu[hidden] { display: none; }
.menu button { display: block; width: 100%; text-align: left; padding: 9px 10px; border-radius: 2px; }
.menu button:hover { background: var(--ground); }
.menu b { display: block; font-weight: 600; }
.menu span { display: block; font-size: 13px; color: var(--ink-muted); }
.chips { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips button { flex: none; height: 28px; padding: 0 10px; border: 1px solid var(--rule); border-radius: 2px; background: var(--card); font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.chips button[aria-pressed="true"] { background: var(--bug); border-color: var(--bug); color: #fff; }
.wk { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 8px; font-family: "Barlow Semi Condensed", sans-serif; text-transform: uppercase; }
.wk b { font-weight: 800; font-size: 17px; }
.wk span { font-weight: 600; font-size: 14px; color: var(--ink-muted); letter-spacing: .04em; }
.cf { margin: 12px 0 6px; font-size: 13px; font-weight: 600; color: var(--ink-muted); }
.gl { display: flex; flex-direction: column; gap: 6px; }
.gm { display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr); align-items: stretch; background: var(--bug); border-radius: 3px; overflow: hidden; color: #fff; }
.tm { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 42px; padding: 0 12px; text-align: left; min-width: 0; }
.tm b { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 17px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tm > span { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 15px; color: var(--bug-muted); }
.tm:hover { background: var(--seg); }
.tm[aria-pressed="true"] { background: var(--live); color: var(--bug); }
.tm[aria-pressed="true"] > span { color: var(--bug); }
.tm.lost b { color: var(--bug-muted); text-decoration: line-through; }
.tm.lost > span { visibility: hidden; }
.at { display: grid; place-items: center; font-size: 12px; color: var(--bug-muted); background: var(--seg); }
.gm .tag { grid-column: 1 / -1; padding: 4px 12px; font-size: 12px; color: var(--bug-muted); background: var(--seg); border-top: 1px solid var(--seg-2); }
.gm .tag b { color: var(--live); font-family: "Barlow Semi Condensed", sans-serif; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }
.empty { margin-top: 18px; color: var(--ink-muted); }
.gm.bigg { box-shadow: inset 0 0 0 2px var(--live); }
.legend { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; font-size: 13px; color: var(--ink-muted); }
.legend .sw { width: 22px; height: 14px; border-radius: 2px; background: var(--bug); box-shadow: inset 0 0 0 2px var(--live); }

/* Races: one row per conference; tap to open the standings. */
.races { display: flex; flex-direction: column; gap: 6px; }
.rc { background: var(--bug); color: #fff; border-radius: 3px; overflow: hidden; }
.rc > button { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; padding: 9px 12px; text-align: left; }
.rc > button:hover { background: var(--seg); }
.rc .cn { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: .03em; }
.rc .chev { color: var(--bug-muted); transition: transform 140ms; }
.rc.open .chev { transform: rotate(180deg); }
.rc .ld { grid-column: 1 / -1; font-size: 13px; color: #d6deeb; }
.rc .ld em { font-style: normal; font-weight: 700; color: #fff; }
.rc .chg { margin-left: 6px; font-family: "Barlow Semi Condensed", sans-serif; font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--bug); background: var(--live); padding: 0 5px; border-radius: 2px; vertical-align: 2px; }
.rc .st { display: none; border-top: 1px solid var(--seg-2); background: var(--seg); padding: 4px 12px 10px; font-size: 13px; }
.rc.open .st { display: block; }
.st table { width: 100%; border-collapse: collapse; }
.st th { font-weight: 600; color: var(--bug-muted); text-align: right; font-size: 11px; padding: 6px 0 2px; }
.st th:first-child { text-align: left; }
.st td { padding: 4px 0; text-align: right; border-top: 1px solid var(--seg-2); }
.st td:first-child { text-align: left; font-weight: 600; }
.st th { white-space: nowrap; padding-left: 8px; }
.st td:first-child i { display: block; font-size: 12px; font-style: normal; font-weight: 400; margin-left: 0 !important; color: var(--bug-muted); margin-left: 6px; }
.st p { margin: 8px 0 0; color: var(--bug-muted); font-size: 12px; }

.tabs { display: none; }

@media (min-width: 900px) { .app { height: 100dvh; } .body { overflow: hidden; } }
/* Narrower desktop: races fold under the field. */
@media (max-width: 1279px) and (min-width: 900px) {
  .body { grid-template-columns: 380px minmax(0, 1fr); }
  .left { display: block; grid-column: 1; grid-row: 1; overflow-y: auto; border-right: 1px solid var(--rule); background: var(--card); }
  .left .pane { overflow: visible; border: 0; }
  #races { padding-top: 0; }
  #races h2 { padding-top: 18px; border-top: 1px solid var(--rule); }
  .brand span, .toteam { display: none; }
}
@media (max-width: 1439px) and (min-width: 900px) { .brand span { display: none; } }
/* Short desktop: slimmer strip and rows. */
@media (max-height: 700px) and (min-width: 900px) {
  .strip { height: 50px; }
  .title { font-size: 19px; }
  .pane { padding-top: 16px; }
  .fr { min-height: 42px; }
}

/* Phone: the bug wraps; tabs pick one pane, the field first. */
@media (max-width: 899px) {
  .strip { height: auto; flex-wrap: wrap; }
  .brand, .toteam, .title { display: none; }
  .sum { flex: 1; min-width: 0; height: 48px; padding: 0 14px; border-right: 0; }
  .sum b { font-size: 17px; }
  .sum span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acts button { height: 48px; padding: 0 12px; font-size: 14px; }
  .acts .share { min-width: 0; }
  .tm { padding: 0 10px; min-height: 40px; }
  .tm b { font-size: 15px; }
  .tm > span { font-size: 14px; }
  .head { order: 5; flex: 1 0 100%; padding: 8px 14px; border-top: 1px solid var(--seg-2); font-size: 14px; }
  .head:not(.on) { display: none; }
  .head span { white-space: normal; }
  .tabs { display: flex; position: sticky; top: var(--top-h, 0px); z-index: 5; background: var(--ground); padding: 10px 14px 8px; gap: 6px; }
  .tabs button { flex: 1; height: 36px; border-radius: 3px; background: var(--card); border: 1px solid var(--rule); font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); }
  .tabs button[aria-selected="true"] { background: var(--bug); border-color: var(--bug); color: #fff; }
  .body { display: block; }
  .pane { padding: 8px 14px 40px; overflow: visible; border: 0 !important; background: transparent !important; }
  .pane:not(.show) { display: none; }
  .fillw { order: -1; }
}
@media (prefers-reduced-motion: reduce) { .fr.flash { animation: none; } }

/* Draft control: compare with and without logos. */
.lg { display: inline-block; width: 1.2em; height: 1.2em; object-fit: contain; vertical-align: -0.24em; margin-right: .35em; }
.rk { font-size: max(11px, .74em); font-weight: 700; margin-right: .3em; letter-spacing: 0; }
.lg-l { display: none; }
[aria-pressed="true"] .lg-d { display: none; }
[aria-pressed="true"] .lg-l { display: inline-block; }
.nologos .lg { display: none !important; }
.logo-toggle { position: fixed; left: 14px; bottom: 14px; z-index: 50; height: 32px; padding: 0 14px; border-radius: 16px; background: #fff; color: #111; border: 1px solid #c9ccd2; font: 600 13px/1 system-ui, sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,.15); cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top">
    <div class="strip bc">
      <a class="brand" href="a-scorebug.html">
        <svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="32" rx="28" ry="17" transform="rotate(-35 32 32)" fill="#fff"/><path d="M14 36 L24 36 L28 26 L34 42 L38 32 L50 32" stroke="#0f1a2b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-35 32 32)"/></svg>
        <span>Mathematically Alive</span>
      </a>
      <div class="title">Season Lab <span class="beta">Beta</span></div>
      <div class="sum"><b id="sum">No picks yet</b><span id="seasons">20,000 seasons simulated</span></div>
      <p class="head" id="head" aria-live="polite"><span>Pick a game, or fill the rest. The field follows.</span></p>
      <div class="acts">
        <button type="button" id="undo" disabled>Undo</button>
        <button type="button" id="reset" disabled>Reset</button>
        <button type="button" id="share" class="share">Share</button>
      </div>
      <span class="toteam">Through Nov 7</span>
    </div>
  </header>

  <div class="tabs" role="tablist" aria-label="Season Lab">
    <button role="tab" aria-selected="true" data-tab="field">Field</button>
    <button role="tab" aria-selected="false" data-tab="games">Games</button>
    <button role="tab" aria-selected="false" data-tab="races">Races</button>
  </div>

  <div class="body">
    <div class="left">
      <section class="pane show" id="field" aria-labelledby="field-h">
        <div class="ph"><h2 id="field-h">The field</h2>
          <div class="segc" role="group" aria-label="Show"><button type="button" aria-pressed="true" data-view="seeds">Seeds</button><button type="button" aria-pressed="false" data-view="bracket">Bracket</button></div></div>
        <p class="note"><span class="beta">Beta</span> Modelled, not the committee. #N is this week’s committee ranking.</p>
        <div id="seeds"></div>
        <div id="bracket" hidden></div>
      </section>
      <section class="pane" id="races" aria-labelledby="races-h">
        <h2 id="races-h">Title races</h2>
        <p class="note">Title-game odds. Tap for standings.</p>
        <div class="races" id="racelist"></div>
      </section>
    </div>
    <section class="pane" id="games" aria-labelledby="games-h">
      <div class="ph"><h2 id="games-h">Games left</h2>
        <div class="segc" role="group" aria-label="Which games"><button type="button" aria-pressed="true" data-scope="big">Big games<i id="nbig"></i></button><button type="button" aria-pressed="false" data-scope="all">All<i id="nall"></i></button></div></div>
      <div class="ctl">
        <label class="findw"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input class="find" id="find" type="search" placeholder="Find a team" aria-label="Find a team"></label>

    const bubble = (after ? BUBBLE.after : BUBBLE.before).map(([name, pct]) => ({ name, pct, color: COLORS[name] || "#5a6780", out: after && name === "UCLA" }));
    const confs = CONFS.map((c) => {
      const rows = after && c.after ? c.after : c.rows;
      const lead = [...rows].sort((x, y) => parseFloat(y[3].replace("<", "")) - parseFloat(x[3].replace("<", ""))).slice(0, 2);
      const champ = [...rows].sort((x, y) => parseFloat(y[4].replace("<", "")) - parseFloat(x[4].replace("<", "")))[0];
      return { name: c.name, rows, more: c.more, lead, champ, moved: after && !!c.after };
    });
    const n = Object.keys(state.picks).length + Object.keys(state.bracket).length;
    const open = games.filter((g) => !state.picks[g.key]).length;
    return {
      picks: state.picks, count: n, open, refining: state.refining, canUndo: state.history.length > 0,
      summary: n === 0 ? "No picks yet" : `${n} pick${n === 1 ? "" : "s"}`,
      seasons: state.refining ? "Refining…" : "20,000 seasons simulated",
      headline: after ? "BYU into the field as the 11 seed; UCLA out." : n > 0 ? "No change to the field." : "",
      field, bubble, confs, bracket: bracket(), ranking: RANKING.map(([name, rec, avg, top], i) => ({ rank: i + 1, name, rec, avg, top, inField: field.some((f) => f.name === name) })),
    };
  }

  // Team ids (for logos) and this week's committee ranking, from data/season-2026.json.
  const TID = {"Auburn":2,"UAB":5,"South Alabama":6,"Arkansas":8,"Arizona State":9,"Arizona":12,"Sacramento State":16,"San Diego State":21,"San José State":23,"Stanford":24,"California":25,"UCLA":26,"USC":30,"Colorado State":36,"Colorado":38,"UConn":41,"Delaware":48,"Florida State":52,"Jacksonville State":55,"Florida":57,"South Florida":58,"Georgia Tech":59,"Georgia":61,"Hawai'i":62,"Iowa State":66,"Boise State":68,"Northwestern":77,"Indiana":84,"Notre Dame":87,"Kentucky":96,"Louisville":97,"Western Kentucky":98,"LSU":99,"Boston College":103,"Massachusetts":113,"Maryland":120,"Michigan State":127,"Michigan":130,"Minnesota":135,"Missouri":142,"Ole Miss":145,"Duke":150,"East Carolina":151,"NC State":152,"North Carolina":153,"Wake Forest":154,"Nebraska":158,"Rutgers":164,"New Mexico State":166,"New Mexico":167,"Syracuse":183,"Bowling Green":189,"Miami (OH)":193,"Ohio State":194,"Ohio":195,"Oklahoma State":197,"Oklahoma":201,"Tulsa":202,"Oregon State":204,"Penn State":213,"Temple":218,"Pittsburgh":221,"Clemson":228,"Memphis":235,"Vanderbilt":238,"Baylor":239,"Rice":242,"Texas A&M":245,"Houston":248,"North Texas":249,"Texas":251,"BYU":252,"Utah":254,"James Madison":256,"Virginia":258,"Virginia Tech":259,"Washington":264,"Washington State":265,"Wisconsin":275,"Marshall":276,"West Virginia":277,"Fresno State":278,"Georgia Southern":290,"Old Dominion":295,"Louisiana":309,"Coastal Carolina":324,"Texas State":326,"Utah State":328,"Alabama":333,"Kennesaw State":338,"Mississippi State":344,"Army":349,"Illinois":356,"Air Force":2005,"Akron":2006,"App State":2026,"Arkansas State":2032,"Ball State":2050,"Buffalo":2084,"UCF":2116,"Central Michigan":2117,"Cincinnati":2132,"Eastern Michigan":2199,"Florida Atlantic":2226,"Florida International":2229,"Georgia State":2247,"Iowa":2294,"Kansas":2305,"Kansas State":2306,"Kent State":2309,"Liberty":2335,"Louisiana Tech":2348,"Miami":2390,"Middle Tennessee":2393,"Navy":2426,"Charlotte":2429,"UL Monroe":2433,"UNLV":2439,"Nevada":2440,"North Dakota State":2449,"Northern Illinois":2459,"Oregon":2483,"Purdue":2509,"Sam Houston":2534,"SMU":2567,"Southern Miss":2572,"South Carolina":2579,"Missouri State":2623,"TCU":2628,"Tennessee":2633,"UTSA":2636,"UTEP":2638,"Texas Tech":2641,"Toledo":2649,"Troy":2653,"Tulane":2655,"Western Michigan":2711,"Wyoming":2751};
  const RANK = {"Miami":1,"Georgia":2,"Utah":3,"Indiana":4,"Alabama":5,"Kentucky":6,"Texas":7,"UCLA":8,"BYU":9,"Ole Miss":10,"Notre Dame":11,"Ohio State":12,"Tennessee":13,"LSU":14,"Texas Tech":15,"Wake Forest":16,"Houston":17,"Missouri":18,"Iowa":19,"USC":20,"South Carolina":21,"Arizona":22,"Oregon":23,"Florida":24,"Boise State":25};

  window.LAB = {
    games, WEEKS, COLORS, TID, RANK, view,
    subscribe(f) { subs.push(f); f(view()); },
    pick(key, team) {
      const picks = { ...state.picks };
      if (picks[key] === team) delete picks[key]; else picks[key] = team;
      commit({ picks });
    },
    pickBracket(i, team) {
      const b = { ...state.bracket };
      const old = b[i];
      if (old === team) delete b[i]; else b[i] = team;
      if (old !== undefined) SHAPE.forEach(([x, y], j) => { if ([x, y].some((s) => s[0] === "w" && s[1] === i) && b[j] === old) delete b[j]; });
      commit({ bracket: b });
    },
    fill(how) {
      const picks = { ...state.picks };
      let seed = how === "favorites" ? 0 : (Date.now() % 2147483647) || 1;
      const rand = () => (seed = (seed * 48271) % 2147483647) / 2147483647;
      games.forEach((g) => {
        if (picks[g.key]) return;
        const pa = g.awayOdds / (g.awayOdds + g.homeOdds);
        picks[g.key] = how === "favorites" ? (g.awayOdds > g.homeOdds ? g.away : g.home) : rand() < pa ? g.away : g.home;
      });
      commit({ picks });
    },
    undo() { const p = state.history.pop(); if (p) { Object.assign(state, p); refine(); } },
    reset() { if (Object.keys(state.picks).length || Object.keys(state.bracket).length) commit({ picks: {}, bracket: {} }); },
  };
})();
</script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
// A team as shown everywhere: logo, this week's committee ranking, name. `dark` picks the logo for dark backgrounds.
// On the board it carries both logo versions; a filled (picked) button swaps to the light-background one.
const logo = (n, dark = true) => {
  const id = LAB.TID[n];
  if (!id) return "";
  const src = (v) => `https://cdn.collegefootballdata.com/${v}/64/${id}.png`;
  return dark ? `<img class="lg lg-d" src="${src("logos-dark")}" alt=""><img class="lg lg-l" src="${src("logos")}" alt="">` : `<img class="lg" src="${src("logos")}" alt="">`;
};
const T = (n, dark = true, ranked = true) => {
  const r = ranked && LAB.RANK[n];
  return `${logo(n, dark)}${r ? `<span class="rk">#${r}</span>` : ""}${esc(n)}`;
};
const ui = { view: "seeds", scope: "big", conf: "All", find: "", top25: false, open: new Set(), tab: "field" };
let last;

const CONF_CHIPS = ["All", "ACC", "Big Ten", "SEC", "Big 12", "American", "Pac 12", "Mountain West", "Sun Belt", "MAC", "CUSA", "Non-con"];
$("#chips").innerHTML = CONF_CHIPS.map((c) => `<button type="button" aria-pressed="${c === "All"}" data-conf="${esc(c)}">${esc(c)}</button>`).join("");
$("#nbig").textContent = LAB.games.filter((g) => g.big).length;
$("#nall").textContent = LAB.games.length;

function seedsHTML(v) {
  const row = (f) => `<div class="fr${f.move && v.refining ? " flash" : ""}"><span class="sd">${f.seed}</span><span class="c" style="background:${f.color}"></span>
    <span class="n"><b>${T(f.name)}</b></span>
    <span class="o">${f.pct}%<small>In</small></span>
    <span class="mv ${f.move === "new" ? "new" : ""}">${f.move === "new" ? "NEW" : f.move === "up" ? "▲" : f.move === "down" ? "▼" : ""}</span></div>`;
  const byes = v.field.filter((f) => f.bye), rest = v.field.filter((f) => !f.bye);
  let h = `<div class="board"><div class="grp">First-round byes<span>Chance in</span></div>${byes.map(row).join("")}<div class="grp">First round</div>${rest.map(row).join("")}</div>`;
  h += `<h3>On the bubble</h3><div class="bub">${v.bubble.map((b) => `<div class="br${b.out ? " out" : ""}"><span class="c" style="background:${b.color}"></span><b>${T(b.name, false)}</b><span class="o">${b.pct}%</span><span class="mv">${b.out ? "▼ " : ""}</span></div>`).join("")}</div>`;
  h += `<button type="button" class="more" id="t25" aria-expanded="${ui.top25}">${ui.top25 ? "Hide the top 25" : "Show the full projected top 25"}</button>`;
  if (ui.top25) h += `<ol class="rank">${v.ranking.map((r) => `<li class="${r.inField ? "inf" : ""}"><span>${r.rank}</span><span><b>${T(r.name, false, false)}</b></span><span><i>${r.rec}</i></span></li>`).join("")}</ol>`;
  return h;
}

function bracketHTML(v) {
  const rounds = {};
  v.bracket.forEach((g) => (rounds[g.round] ??= []).push(g));
  const side = (g, s, o) => {
    if (!s.name) return `<div class="side tbd"><span class="s"></span><b>Winner of game ${s.from + 1}</b></div>`;
    const lbl = `<span class="s">${s.seed}</span><b>${T(s.name)}</b>`;
    if (!o.name) return `<div class="side">${lbl}</div>`;
    const on = g.pick === s.name, lost = g.pick && !on;
    return `<button type="button" class="side${lost ? " lost" : ""}" aria-pressed="${on}" data-br="${g.index}" data-team="${esc(s.name)}">${lbl}</button>`;
  };
  return Object.entries(rounds).map(([r, list]) => `<div class="rd"><h3>${r}</h3>${list.map((g) => `<div class="bg"><div class="gh">Game ${g.index + 1} · ${g.index < 4 ? "at the higher seed" : "neutral site"}</div>${side(g, g.a, g.b)}${side(g, g.b, g.a)}</div>`).join("")}</div>`).join("")
    + `<p class="note" style="margin-top:14px">Pick a winner once both teams are set.</p>`;
}

function gamesHTML(v) {
  const q = ui.find.trim().toLowerCase();
  const shown = LAB.games.filter((g) => (ui.scope === "all" || g.big) && (ui.conf === "All" || g.group === ui.conf)
    && (!q || g.away.toLowerCase().includes(q) || g.home.toLowerCase().includes(q)));
  if (!shown.length) return `<p class="empty">No games left for this filter.</p>`;
  const weeks = new Map();
  shown.forEach((g) => { const w = weeks.get(g.week) ?? weeks.set(g.week, new Map()).get(g.week); (w.get(g.group) ?? w.set(g.group, []).get(g.group)).push(g); });
  const team = (g, t, odds, other) => {
    const p = v.picks[g.key], on = p === t, lost = p && p === other;
    return `<button type="button" class="tm${lost ? " lost" : ""}" aria-pressed="${on}" data-key="${esc(g.key)}" data-team="${esc(t)}" title="${on ? "Picked. Tap again to clear." : "Pick " + esc(t) + " to win"}"><b>${T(t)}</b><span>${odds}%</span></button>`;
  };
  const game = (g) => `<div class="gm${g.big && ui.scope === "all" ? " bigg" : ""}">${team(g, g.away, g.awayOdds, g.home)}<span class="at">${g.neutral ? "vs" : "at"}</span>${team(g, g.home, g.homeOdds, g.away)}</div>`;
  let h = ui.scope === "all" ? `<p class="legend"><span class="sw"></span>Yellow outline: a big game, one that moves the field most</p>` : "";
  for (const [w, groups] of weeks) {
    h += `<div class="wk"><b>Week ${w}</b><span>${LAB.WEEKS[w]}</span></div>`;
    if (ui.scope === "big") h += `<div class="gl">${[...groups.values()].flat().map(game).join("")}</div>`;
    else for (const [c, list] of groups) h += `<div class="cf">${esc(c)}</div><div class="gl">${list.map(game).join("")}</div>`;
  }
  return h;
}

function racesHTML(v) {
  return v.confs.map((c) => `<div class="rc${ui.open.has(c.name) ? " open" : ""}"><button type="button" aria-expanded="${ui.open.has(c.name)}" data-race="${esc(c.name)}">
      <span class="cn">${esc(c.name)}${c.moved ? `<span class="chg">Moved</span>` : ""}</span><span class="chev" aria-hidden="true">▾</span>
      <span class="ld"><em>${T(c.lead[0][0])}</em> ${c.lead[0][3]} · <em>${T(c.lead[1][0])}</em> ${c.lead[1][3]}</span></button>
    <div class="st"><table><thead><tr><th>Team</th><th>Title game</th><th>Wins it</th></tr></thead><tbody>
      ${c.rows.map((r) => `<tr><td>${T(r[0])}<i>${r[1]} · ${r[2]} open</i></td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join("")}</tbody></table>
      <p>+${c.more} more</p></div></div>`).join("");
}

function render(v) {
  last = v;
  $("#sum").textContent = v.summary;
  const s = $("#seasons"); s.textContent = v.seasons; s.classList.toggle("ref", v.refining);
  const head = $("#head");
  head.classList.toggle("on", !!v.headline);
  head.innerHTML = `<span>${esc(v.headline || "Pick a game, or fill the rest. The field follows.")}</span>`;
  $("#undo").disabled = !v.canUndo;
  $("#reset").disabled = v.count === 0;
  $("#fillb").disabled = v.open === 0;
  $("#seeds").innerHTML = seedsHTML(v);
  $("#bracket").innerHTML = bracketHTML(v);
  $("#racelist").innerHTML = racesHTML(v);
  $("#glist").innerHTML = gamesHTML(v);
  document.documentElement.style.setProperty("--top-h", $("#top").offsetHeight + "px");
}
LAB.subscribe(render);
const rerender = () => render(LAB.view());

document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) { if (!e.target.closest(".fillw")) $("#menu").hidden = true; return; }
  if (t.dataset.key) return LAB.pick(t.dataset.key, t.dataset.team);
  if (t.dataset.br) return LAB.pickBracket(+t.dataset.br, t.dataset.team);
  if (t.dataset.view) {
    ui.view = t.dataset.view;
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", b === t));
    $("#seeds").hidden = ui.view !== "seeds"; $("#bracket").hidden = ui.view !== "bracket"; return;
  }
  if (t.dataset.scope) { ui.scope = t.dataset.scope; document.querySelectorAll("[data-scope]").forEach((b) => b.setAttribute("aria-pressed", b === t)); return rerender(); }
  if (t.dataset.conf) { ui.conf = t.dataset.conf; document.querySelectorAll("[data-conf]").forEach((b) => b.setAttribute("aria-pressed", b === t)); return rerender(); }
  if (t.dataset.race) { ui.open.has(t.dataset.race) ? ui.open.delete(t.dataset.race) : ui.open.add(t.dataset.race); return rerender(); }
  if (t.dataset.tab) {
    ui.tab = t.dataset.tab;
    document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", b === t));
    document.querySelectorAll(".pane").forEach((p) => p.classList.toggle("show", p.id === ui.tab)); window.scrollTo(0, 0); return;
  }
  if (t.id === "t25") { ui.top25 = !ui.top25; return rerender(); }
  if (t.id === "fillb") { const m = $("#menu"); m.hidden = !m.hidden; t.setAttribute("aria-expanded", !m.hidden); return; }
  if (t.dataset.fill) { $("#menu").hidden = true; $("#fillb").setAttribute("aria-expanded", "false"); return LAB.fill(t.dataset.fill); }
  if (t.id === "undo") return LAB.undo();
  if (t.id === "reset") return LAB.reset();
  if (t.id === "share") { t.textContent = "Link copied"; setTimeout(() => (t.textContent = "Share"), 1600); }
});
$("#find").addEventListener("input", (e) => { ui.find = e.target.value; rerender(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#menu").hidden = true; });
</script>
<button type="button" class="logo-toggle" id="logoToggle" aria-pressed="true">Logos: on</button>
<script>
// Draft control: logos on or off, remembered across the four drafts.
(() => {
  const k = "ma-draft-logos", b = document.getElementById("logoToggle");
  let on = true;
  try { on = localStorage.getItem(k) !== "off"; } catch {}
  const set = (v) => {
    on = v;
    document.documentElement.classList.toggle("nologos", !on);
    b.setAttribute("aria-pressed", String(on));
    b.textContent = on ? "Logos: on" : "Logos: off";
    try { localStorage.setItem(k, on ? "on" : "off"); } catch {}
  };
  set(on);
  b.addEventListener("click", (e) => { e.stopPropagation(); set(!on); });
})();
</script>
